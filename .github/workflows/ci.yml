name: CI
# T0 runs on every change in seconds. T1 runs the CPU tests of the areas a change touches (tools/ci_select.py), in
# shards of a few minutes each; a docs-only change runs T0 alone. Tests marked timing run in the sweep (sweep.yml), not
# here. The chip tier (T2) runs on our own TPUs, outside GitHub. See CI.md.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  t0:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
      t2r_video: ${{ steps.select.outputs.t2r_video }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install -q pytest==9.0.2 ruff==0.14.3 numpy==2.5.4
      - name: Registry, copies, views, imports, docstrings
        run: PYTHONPATH=src python3 -m pytest -q -p no:cacheprovider -m t0 tests/cpu/test_core.py
      - name: Syntax errors and undefined names
        run: ruff check --no-cache --select E9,F63,F7,F82 --output-format github .
      - name: Pick the T1 areas
        id: select
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci_select.py --base "$BASE" --head "$HEAD" --github-output
      - name: Every commit is signed off
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          for c in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' || { echo "commit $c is not signed off (git commit -s)"; exit 1; }
          done

  contracts:
    # Every contract (tests/contracts: op/, tok/, arch/, path/run, spec/, fit/, kv/) on CPU against its reference, the same for every pull
    # request: no area pick, no torch, no model download, no chip. Results (id, status, fingerprint) go to the summary.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install (CPU JAX, no torch)
        run: |
          python3 -m pip install -q uv==0.13.6
          uv pip install --system -q -e ".[cpu]" pytest safetensors   # safetensors: the drafter fixtures of tests/contracts/test_decode_contracts.py
      - name: Contracts
        env:
          MASHBOX_CONTRACTS_OUT: ${{ runner.temp }}/contracts.json
        run: python3 -m pytest tests/contracts -q -p no:cacheprovider -rsxX --durations=10
      - name: Contract results
        if: always()
        run: python3 tools/ci_select.py --contracts-summary "$RUNNER_TEMP/contracts.json" | tee -a "$GITHUB_STEP_SUMMARY"

  t1:
    needs: t0
    if: needs.t0.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.t0.outputs.matrix) }}
    name: t1 (${{ matrix.area }} ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install (CPU torch, no CUDA wheels)
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          python3 -m pip install -q uv==0.13.6
          uv pip install --system -q torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -q -e ".[dev]" $EXTRA
      - name: The pinned Qwen3.8-27B tokenizer files (the official client tests read them)
        if: matrix.area == 'api_clients'
        run: |
          python3 tools/ci_select.py --upstream-files "$RUNNER_TEMP/qwen-upstream"
          echo "MASHBOX_QWEN_UPSTREAM=$RUNNER_TEMP/qwen-upstream" >> "$GITHUB_ENV"
      - name: CPU tests of ${{ matrix.area }} ${{ matrix.shard }}
        env:
          AREA: ${{ matrix.area }}
          SHARD: ${{ matrix.shard }}
          MASHBOX_SKIP_TIMING: "1"      # the gate scripts skip the runs of timing gates too (the sweep runs them)
        run: |
          args=$(python3 tools/ci_select.py --args-of "$AREA" --shard "$SHARD")
          python3 -m pytest $args -p no:cacheprovider -m "$AREA and not t0 and not quarantine and not timing" --durations=15 -rs \
            -o faulthandler_timeout=900 -o junit_family=xunit1 --junitxml="$RUNNER_TEMP/t1.xml"
      - name: Seconds per test file (for tools/ci_select.py SECONDS)
        if: always()
        run: python3 tools/ci_select.py --file-seconds "$RUNNER_TEMP/t1.xml" | tee -a "$GITHUB_STEP_SUMMARY"

  t1-gate:
    # The one required T1 check: green when every leg tools/ci_select.py picked passed, or when it picked none (a docs,
    # licence or registry-version change runs T0 alone and skips every leg). Red when T0 failed, or when a picked leg
    # failed, was cancelled or did not run.
    needs: [t0, t1]
    if: always()
    name: t1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every picked T1 leg passed
        env:
          T0: ${{ needs.t0.result }}
          PICKED: ${{ needs.t0.outputs.any }}
          T1: ${{ needs.t1.result }}
        run: |
          echo "t0=$T0 picked=$PICKED t1=$T1"
          if [ "$T0" != "success" ]; then echo "T0 did not pass: $T0"; exit 1; fi
          case "$PICKED" in
            true) [ "$T1" = "success" ] || { echo "a picked T1 leg did not pass: $T1"; exit 1; } ;;
            false) [ "$T1" = "skipped" ] || { echo "T1 legs ran although none was picked: $T1"; exit 1; } ;;
            *) echo "T0 gave no T1 pick"; exit 1 ;;
          esac
          echo "T1 ok"

  track2rig-video-tests:
    # The video step's own package: Python 3.10, as the tracker it wraps. CPU tests only (no tracker, no GPU). Runs when a
    # file of the package or of CI changed (tools/ci_select.py t2r_video); the required check is the track2rig-video gate below.
    needs: t0
    if: needs.t0.outputs.t2r_video == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.10"
      - run: python3 -m pip install -q "./packages/track2rig-video[test]"
      - run: python3 -m pytest -q -p no:cacheprovider packages/track2rig-video/tests

  track2rig-video:
    # The one required check of the video package: green when its tests passed, or when the change touched nothing of it
    # and the tests were skipped. Red when T0 failed, or when the tests were picked and failed, were cancelled or did not run.
    needs: [t0, track2rig-video-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: The video package tests passed or were not needed
        env:
          T0: ${{ needs.t0.result }}
          PICKED: ${{ needs.t0.outputs.t2r_video }}
          T: ${{ needs.track2rig-video-tests.result }}
        run: |
          echo "t0=$T0 picked=$PICKED tests=$T"
          if [ "$T0" != "success" ]; then echo "T0 did not pass: $T0"; exit 1; fi
          case "$PICKED" in
            true) [ "$T" = "success" ] || { echo "the video package tests did not pass: $T"; exit 1; } ;;
            false) [ "$T" = "skipped" ] || { echo "the tests ran although the change touched nothing of the package: $T"; exit 1; } ;;
            *) echo "T0 gave no video pick"; exit 1 ;;
          esac
          echo "track2rig-video ok"
