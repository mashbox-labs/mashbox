name: Bug report
description: Something broke or gave a wrong result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The exact command
      render: shell
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Chip
      options: [TPU v6e, TPU v5e, another TPU, CPU only]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Output of `~/.local/bin/mashbox env`
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Full error or log
      render: text
