[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mashbox"
version = "0.1.0"
description = "Open models that run faster and cheaper, from MASHBOX Labs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy", "ml_dtypes", "tokenizers", "jinja2==3.1.6", "huggingface_hub", "flatbuffers"]

[project.optional-dependencies]
tpu = ["jax[tpu]==0.11.2"]
cpu = ["jax==0.11.2"]
dev = ["pytest", "jax==0.11.2", "torch", "transformers", "safetensors"]
hy-nomas = ["torch>=2.5", "transformers==4.57.1", "pyyaml", "scipy", "imageio-ffmpeg", "pillow"]

[project.scripts]
mashbox = "mashbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mashbox = ["models.json", "models/*/*.json", "models/*/*.html", "tpu/*.sh", "tpu/*.sha256"]
